[project]
name = "platform-core"
version = "0.1.0"
description = "Fintech Platforms core: shared primitives (RBAC, audit, approvals, config, connectors) for internal tools"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.120",
  "pydantic>=2.9,<3",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg2-binary>=2.9,<3",
  "PyJWT>=2.9,<3",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_core*"]
